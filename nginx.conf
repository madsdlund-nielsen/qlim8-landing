# Rate-limiting zone (http context: this file is an include pulled into the
# main nginx.conf's http block). Keyed on the real client IP. Protects the Next
# server and the local /api/* proxy routes (newsletter signup/unsubscribe) from
# floods. The site is otherwise a thin proxy with no upstream limiter of its own.
limit_req_zone $binary_remote_addr zone=qlim8_landing:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    server_name qlim8.com www.qlim8.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name qlim8.com www.qlim8.com;

    ssl_certificate /etc/letsencrypt/live/qlim8.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qlim8.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Redirect www to non-www
    if ($host = www.qlim8.com) {
        return 301 https://qlim8.com$request_uri;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Force HTTPS for a year, incl. subdomains (app.qlim8.com already sends its
    # own HSTS via helmet and is HTTPS-only, so includeSubDomains is safe).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Baseline CSP for a marketing site. Kept intentionally permissive where
    # Next.js needs it (inline bootstrap/hydration scripts and injected styles)
    # and for images (CMS assets are served from app.qlim8.com); the high-value
    # restrictions are frame-ancestors (clickjacking), object-src and base-uri.
    # connect-src allows https so client fetches to app.qlim8.com and analytics
    # keep working. Validate in the browser console after deploy, then tighten
    # toward nonce-based script-src.
    #
    # script-src names the Google origins explicitly: the gtag library
    # (googletagmanager.com) plus the Google Ads conversion scripts
    # (googleadservices.com, google.com). Without them the tag is refused and
    # neither GA4 nor the Ads conversions fire. Conversion pings are images and
    # https connects, already covered by img-src and connect-src above.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.googleadservices.com https://www.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://app.qlim8.com; object-src 'none'" always;

    # Static assets: long cache
    location /_next/static/ {
        proxy_pass http://web:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_cache_bypass $http_upgrade;
    }

    # Images and the demo film in public/. The film (public/demo) is 11 MB and a
    # player fetches it in ranges, so it stays out of the page flood limit below.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif|mp4)$ {
        proxy_pass http://web:3000;
        add_header Cache-Control "public, max-age=86400";
    }

    # All other requests
    location / {
        # Broad flood protection; burst absorbs a page's asset/API fan-out.
        limit_req zone=qlim8_landing burst=40 nodelay;

        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# staging.qlim8.com: the qlim8-app staging environment, on this host until it
# has a server of its own (qlim8-app docs/en/operations/staging.md). Port 80
# needs no block of its own: the qlim8.com block above is the default server,
# so it answers the ACME challenge for this name and redirects the rest to
# https://$host.
#
# The app runs on the host under PM2, bound to docker0 (172.17.0.1:5000), which
# this container reaches as host.docker.internal (extra_hosts in
# docker-compose.yml) and the internet does not reach at all.
#
# Behind basic auth (/opt/qlim8/staging.htpasswd on the host, never in git),
# except the paths a third party calls without a browser: Stripe's test-mode
# webhook and the OAuth callbacks of the integrations. Missing or empty
# htpasswd file: nginx still starts, and staging answers 500 rather than open.
server {
    listen 443 ssl;
    http2 on;
    server_name staging.qlim8.com;

    ssl_certificate /etc/letsencrypt/live/staging.qlim8.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.qlim8.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    auth_basic "qlim8 staging";
    auth_basic_user_file /etc/nginx/staging.htpasswd;

    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /api/stripe/webhook {
        auth_basic off;
        proxy_pass http://host.docker.internal:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/integrations/[a-z0-9_]+/callback$ {
        auth_basic off;
        proxy_pass http://host.docker.internal:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://host.docker.internal:5000;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
