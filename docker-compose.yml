services:
  web:
    image: ghcr.io/madsdlund-nielsen/qlim8-landing:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # Shared secret for the CMS pull/import (/api/cms/defaults,
      # /api/cms/bundled-articles) and publish-revalidation (/api/revalidate)
      # endpoints: must match CMS_REVALIDATE_SECRET in qlim8-app's .env.
      # Read from a .env file placed next to this compose file on the server
      # (docker compose auto-loads it for ${...} substitution); left unset
      # here it resolves to an empty string and those endpoints fail closed.
      - CMS_REVALIDATE_SECRET=${CMS_REVALIDATE_SECRET:-}
    expose:
      - "3000"
    networks:
      - proxy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - proxy
    # Reload every 6h so a renewed certificate actually reaches the running
    # server. nginx reads the cert files ONCE at startup and holds them in
    # memory: the certbot container below can renew the files on disk without
    # nginx ever noticing. That is exactly what happened on 2026-07-27: the
    # certificate issued Apr 28 expired at 20:16Z while nginx kept serving it,
    # and every visitor got NET::ERR_CERT_DATE_INVALID until nginx was
    # restarted by hand.
    #
    # The reload runs in the background; `nginx -g "daemon off;"` stays PID 1 so
    # the container still dies (and `restart: unless-stopped` fires) if nginx
    # itself exits. `$${!}` is an escaped `${!}`: compose would otherwise try
    # to interpolate it.
    command: /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Renews into the certbot-etc volume using the webroot challenge that
    # nginx.conf serves from /.well-known/acme-challenge/. Renewal only rewrites
    # the files on disk: the nginx service above is what actually puts a renewed
    # certificate into service, via its 6h reload loop.
    #
    # Do NOT add a host-level `certbot renew` cron alongside this. Host certbot
    # writes to the host's /etc/letsencrypt, which is a different filesystem from
    # this named volume, so those renewals never reach nginx. scripts/setup-server.sh
    # used to install exactly such a cron; it has been removed.
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'

networks:
  proxy:
    driver: bridge

volumes:
  certbot-etc:
  certbot-www:
