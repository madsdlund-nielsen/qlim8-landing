services:
  web:
    image: ghcr.io/madsdlund-nielsen/qlim8-landing:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # Shared secret for the CMS pull/import (/api/cms/defaults,
      # /api/cms/bundled-articles) and publish-revalidation (/api/revalidate)
      # endpoints — must match CMS_REVALIDATE_SECRET in qlim8-app's .env.
      # Read from a .env file placed next to this compose file on the server
      # (docker compose auto-loads it for ${...} substitution); left unset
      # here it resolves to an empty string and those endpoints fail closed.
      - CMS_REVALIDATE_SECRET=${CMS_REVALIDATE_SECRET:-}
    expose:
      - "3000"
    networks:
      - proxy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - proxy

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'

networks:
  proxy:
    driver: bridge

volumes:
  certbot-etc:
  certbot-www:
