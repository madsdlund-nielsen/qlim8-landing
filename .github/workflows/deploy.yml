name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/madsdlund-nielsen/qlim8-landing

jobs:
  # Gate. ci.yml runs these on pull requests, but deploy triggers on push to
  # main, so without this job anything that reaches main by another route: a
  # direct push, an admin merge, a branch that never opened a PR: would ship
  # unverified. Cheap to re-run, and it is the difference between "checked on
  # the way in" and "checked before it ships".
  checks:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # --legacy-peer-deps mirrors the Dockerfile, which is the build of record.
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build-and-push:
    name: Build Docker image
    needs: [checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - uses: actions/checkout@v4

      - name: Copy config files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "docker-compose.yml,nginx.conf"
          target: /opt/qlim8/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          # Forwarded to the remote shell via `envs` below. The value travels
          # over the SSH channel only, and GitHub masks it in logs.
          CMS_REVALIDATE_SECRET: ${{ secrets.CMS_REVALIDATE_SECRET }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: CMS_REVALIDATE_SECRET
          # Upsert the secret into the gitignored .env docker-compose.yml
          # reads via ${CMS_REVALIDATE_SECRET} substitution, then deploy.
          script: |
            set -euo pipefail
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/qlim8
            touch .env
            if [ -n "${CMS_REVALIDATE_SECRET:-}" ]; then
              if grep -q '^CMS_REVALIDATE_SECRET=' .env; then
                sed -i "s|^CMS_REVALIDATE_SECRET=.*|CMS_REVALIDATE_SECRET=${CMS_REVALIDATE_SECRET}|" .env
              else
                printf '\nCMS_REVALIDATE_SECRET=%s\n' "${CMS_REVALIDATE_SECRET}" >> .env
              fi
            fi
            docker compose pull web
            docker compose up -d --no-build
            docker image prune -f
