<!doctype html>
<html><head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><meta charset="utf-8"><meta name="viewport" content="width=960">
<style>
html,body{margin:0}
body{background:var(--color-background);width:960px;height:288px;position:relative;overflow:hidden}
svg{position:absolute;left:0;top:0;display:block}
.f{fill:var(--color-primary)}.a{fill:var(--color-accent)}.n{fill:var(--color-sand)}.w{fill:var(--color-warm)}.g{fill:var(--color-background)}
.slab{rx:var(--radius-lg)}
.name{position:absolute;left:48px;top:96px;margin:0;font-family:var(--font-display);font-weight:500;font-size:64px;line-height:.95;letter-spacing:-0.01em;color:var(--color-primary);white-space:nowrap}
.tag{position:absolute;left:48px;top:232px;margin:0;font-family:var(--font-body);font-size:14px;line-height:20px;color:var(--color-muted-foreground);white-space:nowrap}
</style></head><body>
<svg width="960" height="288" viewBox="0 0 960 288" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
blocks: color-primary 288x144, color-accent 192x96, color-sand 192x48, color-warm 48x48 (space-12 multiples), flush, bleeding off the top and right edges; bottom corners radius-lg.
arrangement: a staggered stack, one tall forest slab with sage and sand satellites to its right, a small warm square under the slab; two rows of leaves below.
pattern: leaves (two quarter-circle arcs of a 48px square, a lens), 23 of them in block colours, three cut out of the slab in the ground colour; chosen because the brief is natural, calm and earthy, so the leaf is the one literal motif that is this brand and no other.
steps/radii: 48px units (space-12), radius-lg on the slab group; nothing left of x=480 so the name zone stays clear.
-->
<defs>
<path id="lf" d="M0,48 A48 48 0 0 1 48,0 A48 48 0 0 1 0,48 Z"/>
<clipPath id="c"><rect class="slab" x="480" y="-24" width="504" height="168"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect class="f" x="480" y="0" width="288" height="144"/>
<rect class="a" x="768" y="0" width="192" height="96"/>
<rect class="n" x="768" y="96" width="192" height="48"/>
</g>
<rect class="w" x="480" y="144" width="48" height="48"/>
<use href="#lf" x="576" y="48" class="g"/><use href="#lf" transform="translate(720,48) scale(-1,1)" class="g"/><use href="#lf" transform="translate(576,96) scale(-1,1)" class="g"/>
<use href="#lf" x="480" y="192" class="f"/><use href="#lf" transform="translate(576,192) scale(-1,1)" class="a"/><use href="#lf" x="576" y="192" class="n"/><use href="#lf" transform="translate(672,192) scale(-1,1)" class="f"/><use href="#lf" x="672" y="192" class="a"/><use href="#lf" transform="translate(768,192) scale(-1,1)" class="n"/><use href="#lf" x="768" y="192" class="f"/><use href="#lf" transform="translate(864,192) scale(-1,1)" class="a"/><use href="#lf" x="864" y="192" class="a"/><use href="#lf" transform="translate(960,192) scale(-1,1)" class="f"/><use href="#lf" transform="translate(528,240) scale(-1,1)" class="n"/><use href="#lf" x="528" y="240" class="f"/><use href="#lf" transform="translate(624,240) scale(-1,1)" class="a"/><use href="#lf" x="624" y="240" class="n"/><use href="#lf" transform="translate(720,240) scale(-1,1)" class="f"/><use href="#lf" x="720" y="240" class="a"/><use href="#lf" transform="translate(816,240) scale(-1,1)" class="n"/><use href="#lf" x="816" y="240" class="f"/><use href="#lf" transform="translate(912,240) scale(-1,1)" class="a"/><use href="#lf" x="912" y="240" class="n"/>
</svg>
<h1 class="name">qlim8 Grøn<br>Designsystem</h1>
<p class="tag">Rolig, tryg og jordnær. Til dem, der vil have ro i maven.</p>
</body></html>
